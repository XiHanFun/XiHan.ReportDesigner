name: Release

# 推 v<版本> 标签时：核对标签，构建并核对产物，把三个公开包发到 npm（带 provenance），在空项目里装刚发的版本冒烟，再部署文档站。
# 版本号、各包 CHANGELOG、文档站的更新日志由人用 report/scripts/release/VersionUpgrade 定好并快进到发布分支（预览版 preview，正式版 main）；这里不提交。发完 npm 后按文档站更新日志的这一版建同名 GitHub Release，预发布版标成 Pre-release。
# 手动 Run workflow 时选中一个版本标签；选分支会被 guard 拦下。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    working-directory: report

jobs:
  guard:
    name: 核对标签
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 预览版标签只放行 preview，正式版标签只放行 main
        working-directory: .
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::发布只接受版本标签触发，收到 $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          # 带预发布后缀（v1.0.0-rc.1）的是预览版
          case "$GITHUB_REF_NAME" in
            *-*) branch=preview ;;
            *) branch=main ;;
          esac
          git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch"; then
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 $branch 的历史里，拒绝发布。先把要发布的提交快进到 $branch，再在上面打标签。"
            exit 1
          fi
          echo "标签 $GITHUB_REF_NAME 在 $branch 上，放行"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 标签号与包版本、预发布模式对账
        run: node scripts/release/check-release-tag.mjs
      - name: 更新日志里有这一版
        run: node scripts/release/release-notes.mjs --check

  publish:
    name: 发到 npm
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # 仓库根没有 package.json，pnpm 版本以工作区清单为准
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: report/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: report/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: 产物契约（publint + attw）
        run: pnpm gate:publish
      # changeset publish 只发 npm 上还没有的版本；预发布模式下自动加上 dist-tag
      - name: Publish to npm
        run: pnpm exec changeset publish --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # 正式版还没发出之前，预发布版也挂上 latest；npm 上已有正式版的包不动
      - name: 预发布版跟上 latest
        run: node scripts/release/promote-latest.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 说明取文档站更新日志的这一版；重跑时这个标签的 Release 已经在，只更新标题与说明
  github-release:
    name: 建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 按更新日志建这个标签的 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/release/release-notes.mjs --out "$notes"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            prerelease=()
            case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes" "${prerelease[@]}"
          fi

  smoke:
    name: 发布后冒烟
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 在空项目里装刚发的版本，类型检查、打包与 Node 侧导入
        run: node scripts/release/smoke.mjs --version "${GITHUB_REF_NAME#v}"

  docs:
    name: 部署文档站
    needs: smoke
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-docs.yml
