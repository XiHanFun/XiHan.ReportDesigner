<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>报表设计器 · 开发预览</title>
  <style>
    body { margin: 0; background: var(--xh-bg-page); color: var(--xh-fg-default); }
    .page { display: grid; gap: var(--xh-space-4); max-inline-size: 80rem; margin-inline: auto; padding: var(--xh-space-4); }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--xh-space-3); }
    .switch-label { display: inline-flex; align-items: center; gap: var(--xh-space-2); color: var(--xh-fg-muted); font-size: var(--xh-font-size-sm); }
    xh-report-viewer { margin-block-start: var(--xh-space-3); }
    .log { min-block-size: 6rem; max-block-size: 10rem; overflow: auto; padding: var(--xh-space-2); border: var(--xh-stroke-thin) solid var(--xh-border-subtle); border-radius: var(--xh-radius-md); color: var(--xh-fg-muted); font-family: var(--xh-font-family-mono); font-size: var(--xh-font-size-xs); white-space: pre-wrap; }
  </style>
</head>
<body>
  <main class="page">
    <xh-alert tone="warning">
      <div data-xh-part="root">
        <div data-xh-part="content">
          <div data-xh-part="title">这是开发预览，不是产品</div>
          <div data-xh-part="description">只用来查看报表查看器的当前进度。界面与接口都还会变；数据是按固定种子生成的五千条销售订单，不会保存。</div>
        </div>
      </div>
    </xh-alert>

    <div class="bar">
      <xh-toolbar>
        <div data-xh-part="root" aria-label="报表操作">
          <div data-xh-part="group">
            <button data-xh-part="item" type="button" value="refresh">刷新</button>
            <button data-xh-part="item" type="button" value="export">导出 xlsx</button>
          </div>
          <div data-xh-part="separator"></div>
          <div data-xh-part="group">
            <button data-xh-part="item" type="button" value="clear-log">清空事件记录</button>
          </div>
        </div>
      </xh-toolbar>
      <span class="switch-label">
        <xh-switch id="zh" default-checked>
          <button data-xh-part="root" aria-label="中文语言包">
            <span data-xh-part="thumb"></span>
          </button>
        </xh-switch>
        中文语言包 reportZhCN
      </span>
      <span class="switch-label">
        <xh-switch id="aggregate">
          <button data-xh-part="root" aria-label="后端聚合">
            <span data-xh-part="thumb"></span>
          </button>
        </xh-switch>
        后端按请求聚合（关闭时返回明细行）
      </span>
    </div>

    <xh-tabs default-value="detail">
      <div data-xh-part="root">
        <div data-xh-part="list" aria-label="示例报表">
          <button data-xh-part="trigger" value="detail">明细表</button>
          <button data-xh-part="trigger" value="group">分组报表</button>
          <button data-xh-part="trigger" value="crosstab">交叉表</button>
          <button data-xh-part="trigger" value="dashboard">看板</button>
          <div data-xh-part="indicator"></div>
        </div>
        <div data-xh-part="content" value="detail">
          <xh-report-viewer data-report="detail"></xh-report-viewer>
        </div>
        <div data-xh-part="content" value="group">
          <xh-report-viewer data-report="group"></xh-report-viewer>
        </div>
        <div data-xh-part="content" value="crosstab">
          <xh-report-viewer data-report="crosstab"></xh-report-viewer>
        </div>
        <div data-xh-part="content" value="dashboard">
          <xh-report-viewer data-report="dashboard"></xh-report-viewer>
        </div>
      </div>
    </xh-tabs>

    <div class="log" id="log" aria-live="polite"></div>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
